services:
  postgres:
    image: postgres:16-alpine
    container_name: scedular-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scedular
      POSTGRES_USER: scedular
      POSTGRES_PASSWORD: scedular
    ports:
      - "5432:5432"
    volumes:
      - scedular_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scedular -d scedular"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  scedular_pgdata:
